<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dodle Search" />
    <title>Dodle Search</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://noesis.dodle.link/noe-ui/web/css/noe-pixel.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/" aria-label="Dodle home">dodle</a>
      <nav class="nav-links" aria-label="Primary navigation">
        <a href="#about">About</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false">
          <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span>
          <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 15.5A9 9 0 0 1 8.5 3.6 9 9 0 1 0 20.4 15.5Z"></path></svg></span>
        </button>
      </nav>
    </header>

    <main class="main-content">
      <section class="search-stage" aria-labelledby="page-title">
        <h1 id="page-title">dodle</h1>

        <form class="search-form" id="search-form" action="https://www.google.com/search" method="get" role="search">
          <label class="sr-only" for="search-input">Search the web</label>
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="search-input" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" />
          <button class="clear-button" type="button" aria-label="Clear search">×</button>
          
        </form>
        <div class="search-actions">
          <button class="search-button" form="search-form" type="submit">Dodle Search</button>
          <button class="lucky-button" type="button">I'm Feeling Curious</button>
        </div>
      </section>

      <p class="about-copy" id="about">A simple search for a less distracted web.</p>
    </main>

    <footer class="footer">
      <span>© 2025 Dodle</span>
      <div class="footer-links"><a href="#privacy">Privacy</a><a href="#about">About</a></div>
    </footer>
    <script src="js/script.js"></script>
    <script>window.noeWebPixel = true;</script>
    <script type="module" src="https://noesis.dodle.link/noe-ui/brain/limbric.js"></script>
  </body>
</html>
