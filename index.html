<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dodle Search" />
    <meta name="version" content="1.3.0" />
    <title>dodle - Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="preload" href="font/munson-font/Munson-MVymB.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="icon" type="image/png" href="favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="dodle" />
    <link rel="manifest" href="site.webmanifest" />
    <script>
      document.documentElement.classList.toggle('dark', localStorage.getItem('dodle-theme') !== 'light');
    </script>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="https://noesis.dodle.link/noe-ui/web/css/noe-pixel.css" />
  </head>
  <body>
    <header class="topbar">
      <nav class="nav-links" aria-label="Primary navigation" data-i18n-aria="navLabel">
        <button class="theme-toggle" type="button" aria-label="Switch to dark mode" aria-pressed="false" data-i18n-aria="themeDark">
          <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg></span>
          <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 15.5A9 9 0 0 1 8.5 3.6 9 9 0 1 0 20.4 15.5Z"></path></svg></span>
        </button>
        <div class="language-switcher">
          <button class="language-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language English">English</button>
          <ul class="language-menu" role="listbox" aria-label="Choose language" hidden>
            <li><button type="button" role="option" aria-selected="true" data-language="en">English</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="ja">日本語</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="zh">中文</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="th">ไทย</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="ko">한국어</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="fr">Français</button></li>
            <li><button type="button" role="option" aria-selected="false" data-language="de">Deutsch</button></li>
          </ul>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <section class="search-stage" aria-labelledby="page-title">
        <h1 id="page-title">dodle</h1>

        <form class="search-form" id="search-form" action="https://www.google.com/search" method="get" role="search">
          <label class="sr-only" for="search-input" data-i18n="searchLabel">Search the web</label>
          <input id="search-input" name="q" type="search" maxlength="500" placeholder="Search the web" autocomplete="off" spellcheck="false" />
          <button class="clear-button" type="button" aria-label="Clear search">×</button>
        </form>
        <p class="search-status" aria-live="polite" aria-atomic="true"></p>
        <div class="search-actions">
          <button class="search-button" form="search-form" type="submit" data-i18n="searchButton">Search</button>
          <button class="lucky-button" type="button" data-i18n="curiousButton">I'm Feeling Curious</button>
        </div>
      </section>

      <p class="about-copy" id="about" data-i18n="description">A simple search for a less distracted web.</p>
    </main>

    <footer class="footer">
      <span>© <span data-i18n="brand">dodle</span></span>
      <div class="footer-links"><a href="#privacy" data-i18n="privacy">Privacy</a><a href="#about" data-i18n="about">About</a></div>
    </footer>
      <script src="script/words.js"></script>
      <script src="script/script.js"></script>
    <script>window.noeWebPixel = true;</script>
    <script type="module" src="https://noesis.dodle.link/noe-ui/brain/limbric.js"></script>
  </body>
</html>
