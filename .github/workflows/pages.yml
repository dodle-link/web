name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test browser scripts
        run: node --test script/TEST/*.js

      - name: Test local site references
        run: python -m unittest discover -s TEST -p 'test_*.py'

      - name: Test Spider
        working-directory: spider
        run: python -m unittest discover -s TEST -p 'test_*.py'

      - name: Compile Python sources
        run: python -m compileall -q spider

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir _site
          rsync -a --exclude='spider' --exclude='.git' --exclude='_site' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4