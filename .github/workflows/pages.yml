name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Lint
        run: npm run lint

      - name: Test browser scripts
        run: node --test script/TEST/*.js

      - name: Test browser workflows and accessibility
        run: npm run test:browser

      - name: Test local site references
        run: python -m unittest discover -s TEST -p 'test_*.py'

      - name: Test Spider
        working-directory: spider
        run: python -m unittest discover -s TEST -p 'test_*.py'

      - name: Compile Python sources
        run: python -m compileall -q spider

      - name: Install Spider in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/dodle-venv"
          "$RUNNER_TEMP/dodle-venv/bin/python" -m pip install ./spider
          "$RUNNER_TEMP/dodle-venv/bin/dodle" --help
          "$RUNNER_TEMP/dodle-venv/bin/dodle-spider" --help

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    concurrency:
      group: pages
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage site files
        run: |
          mkdir _site
          rsync -a \
            --exclude='spider' \
            --exclude='node_modules' \
            --exclude='browser-tests' \
            --exclude='playwright.config.js' \
            --exclude='eslint.config.js' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            --exclude='.git' \
            --exclude='_site' ./ _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4