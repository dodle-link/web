<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>dodle node</title>
  <link rel="stylesheet" href="../css/node.css">
</head>
<body>
  <header>
    <h1>dodle node</h1>
    <button class="theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="true" title="Toggle color theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 15.5A9 9 0 0 1 8.5 3.6 9 9 0 1 0 20.4 15.5Z"></path></svg>
    </button>
  </header>
  <p id="status">Loading...</p>
  <p>room: <input id="room"> <button id="join">Join</button></p>
  <form id="form">
    <input id="key" placeholder="key" required>
    <input id="val" placeholder="value">
    <button>Set</button>
  </form>
  <ul id="list"></ul>
  <script type="module" src="../script/node.js"></script>
</body>
</html>
