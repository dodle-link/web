<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Stories about food traditions, ingredients, and everyday food culture." data-i18n-meta="description" />
		<title>Blog - dodle</title>
		<script>
			try {
				document.documentElement.classList.toggle('dark', localStorage.getItem('dodle-theme') !== 'light');
			} catch {}
		</script>
		<link rel="stylesheet" href="../css/styles.css" />
	</head>
	<body>
		<header class="topbar">
			<a class="brand" href="../index.html">dodle</a>
			<nav class="nav-links" aria-label="Primary navigation" data-i18n-aria="navLabel">
				<a href="../index.html" data-i18n="home">Home</a>
				<div class="language-switcher">
					<button class="language-toggle" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Language English">English</button>
					<ul class="language-menu" role="listbox" aria-label="Choose language" data-i18n-aria="languageLabel" hidden>
						<li><button type="button" role="option" aria-selected="true" data-language="en">English</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="ja">日本語</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="zh">中文</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="th">ไทย</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="ko">한국어</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="fr">Français</button></li>
						<li><button type="button" role="option" aria-selected="false" data-language="de">Deutsch</button></li>
					</ul>
				</div>
			</nav>
		</header>

		<main class="privacy-content">
			<h1 data-i18n="heading">Blog</h1>
			<p data-i18n="intro">Stories about food traditions, ingredients, and the everyday rituals around them.</p>
			<ul class="blog-list" aria-label="Articles" data-i18n-aria="articlesLabel">
				<li class="blog-list-item">
					<article>
						<a class="blog-list-link" href="traditional-snacks/">
							<h2 data-i18n="articleTitle">Traditional Snacks</h2>
							<p data-i18n="articleExcerpt">From onigiri and poha to samosas and arepas, explore the local ingredients and shared traditions behind familiar small bites.</p>
							<span class="blog-read-more" data-i18n="readMore">Read article</span>
						</a>
					</article>
				</li>
			</ul>
		</main>

		<footer class="footer">
			<span>© dodle</span>
			<div class="footer-links"><a href="../privacy.html" data-i18n="privacy">Privacy</a><a href="../index.html" data-i18n="home">Home</a></div>
		</footer>
		<script src="../script/blog/index.js"></script>
	</body>
</html>
