[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dodle-spider"
version = "1.2.0"
description = "A Python command-line HTTP client"
requires-python = ">=3.10"

[project.scripts]
dodle = "dodle:main"
dodle-spider = "dodle:main"

[tool.setuptools]
py-modules = ["dodle"]

